<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATP: The Energy Molecule of Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2a37; --muted:#546275; --blue:#1b5fa7; --blue-d:#134a85; --blue-bg:#e6eff9;
  --gray:#eef1f5; --line:#c9d2dd; --good:#17703f; --good-bg:#e3f3ea; --bad:#a8231b; --bad-bg:#fbe8e6;
  --energy:#f2b01e; --energy-bg:#fff4d6;
  --bg:#ffffff; --fs:18px; --lh:1.6; --ls:0em; --ws:0em;
  --font:'Lexend',Verdana,Geneva,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);word-spacing:var(--ws);color:var(--ink);background:var(--bg);padding-bottom:96px}
button,select,input,textarea{font:inherit;letter-spacing:inherit;word-spacing:inherit}
h1,h2,h3{line-height:1.25}

/* top bar */
#top{position:sticky;top:0;z-index:30;background:var(--blue);color:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 14px}
#top h1{font-size:1rem;margin:0;font-weight:600;flex:1 1 180px}
.hud{display:flex;align-items:center;gap:8px;font-size:.9rem}
#bat{display:flex;gap:2px;padding:3px;border:2px solid #fff;border-radius:5px;position:relative;margin-right:7px}
#bat i{width:8px;height:16px;background:rgba(255,255,255,.25);border-radius:1px;display:block}
#bat i.on{background:var(--energy)}
#bat:after{content:"";position:absolute;right:-7px;top:6px;width:4px;height:8px;background:#fff;border-radius:0 2px 2px 0}
.hudbtn{background:#fff;color:var(--blue-d);border:0;border-radius:6px;padding:6px 10px;cursor:pointer;min-height:36px;font-size:.85rem}
.hudbtn:focus-visible,.btn:focus-visible,.choice:focus-visible,.tok:focus-visible,.slot:focus-visible,.bucket:focus-visible{outline:3px solid var(--energy);outline-offset:2px}

/* stage */
#stage{max-width:1020px;margin:0 auto;padding:18px 14px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.pagehead h2{margin:2px 0 0;font-size:1.5rem}
.part{font-size:.85rem;color:var(--muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.panel{border:2px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden}
.panel>h3{margin:0;padding:8px 14px;background:var(--gray);font-size:.95rem;border-bottom:2px solid var(--line)}
.panel.play>h3{background:var(--blue-bg);color:var(--blue-d);border-bottom-color:#b9d0ea}
.panel .body{padding:14px}
.panel .body>p:first-child{margin-top:0}
.lead{font-size:1.1em}

/* buttons */
.btn{padding:10px 16px;border-radius:8px;border:2px solid var(--blue);background:#fff;color:var(--blue-d);cursor:pointer;min-height:44px}
.btn.primary{background:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:1.1em;padding:12px 22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:2px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 14px}
#navmsg{font-size:.85rem;color:var(--muted);text-align:center;flex:1}

/* multiple choice */
.q{margin:0 0 20px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0;margin-bottom:0}
.prompt{margin:0 0 6px;font-weight:600}
.choice{display:flex;gap:10px;text-align:left;width:100%;margin:6px 0;padding:10px 12px;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;min-height:44px}
.choice .let{font-weight:700;min-width:1.6em}
.choice:hover:not(:disabled){border-color:var(--blue);background:var(--blue-bg)}
.choice:disabled{color:var(--ink);cursor:default}
.choice.ok{border-color:var(--good);background:var(--good-bg);opacity:1}
.choice.ok:after{content:" ✓";font-weight:700;color:var(--good);margin-left:auto}
.choice.no{border-color:var(--bad);background:var(--bad-bg);opacity:.85}
.choice.no:after{content:" ✗";font-weight:700;color:var(--bad);margin-left:auto}
.choice.pick{border-color:var(--blue);background:var(--blue-bg)}
.fb{margin-top:8px;padding:8px 12px;border-radius:6px;font-weight:600;font-size:.95em}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb.info{background:var(--blue-bg);color:var(--blue-d)}

/* tap-to-place */
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;padding:10px;background:var(--gray);border-radius:8px;min-height:60px}
.tok{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border:2px solid var(--blue);border-radius:8px;background:#fff;cursor:pointer;color:var(--ink);min-width:70px}
.tok.wide{flex-direction:row;text-align:left;width:100%}
.tok.sel{outline:3px solid var(--energy);background:var(--energy-bg)}
.tok:disabled{opacity:.3;cursor:default}
.slot{min-width:84px;min-height:84px;border:3px dashed var(--line);border-radius:10px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:4px;color:var(--muted);text-align:center}
.slot.filled{border-style:solid;border-color:var(--blue);background:var(--blue-bg);color:var(--ink);cursor:default}
.slot .ph{font-size:.8rem}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.ico{width:60px;height:44px}
.ico .a{fill:#fde7e2;stroke:#8a3b2d;stroke-width:3}
.ico .r{fill:#e2ecfb;stroke:#2a4f8f;stroke-width:3}
.ico .p{fill:#dff0e4;stroke:#2c6b45;stroke-width:3}
.ico .g{fill:#f3e8c8;stroke:#7a6420;stroke-width:3}
.ico text{font:700 22px var(--font);fill:var(--ink)}
.tl{font-size:.8rem;font-weight:600}

/* diagrams */
.diagram{width:100%;height:auto;max-width:560px;display:block;margin:6px auto}
.diagram .t{font:600 16px var(--font);fill:var(--ink)}
.diagram .sm{font-size:12px;fill:var(--muted);font-weight:400}
.diagram .adenosine{fill:#fde7e2;stroke:#8a3b2d;stroke-width:3}
.diagram .phos{fill:#dff0e4;stroke:#2c6b45;stroke-width:3}
.diagram .bl{stroke:#546275;stroke-width:9;stroke-linecap:round;transition:opacity .6s}
.diagram .bond{cursor:pointer}
.diagram .bond:hover .bl,.diagram .bond:focus .bl{stroke:var(--blue)}
.diagram .bond:focus{outline:none}
.diagram .bond.ok .bl{stroke:var(--energy)}
.diagram .bond.bad .bl{stroke:var(--bad)}
.diagram .bolt{fill:var(--energy);stroke:#8a5a00;stroke-width:2;opacity:0;transition:opacity .4s}
.diagram .bolt.show{opacity:1}
.diagram .mv{transition:transform .9s ease,opacity .9s}
.diagram .burst{opacity:0;transition:opacity .5s}
.diagram .burst.show{opacity:1}
.diagram .burst text{font:700 14px var(--font);fill:#7a4b00}
.diagram .mem{fill:#dfe5ec;stroke:#8a98a8;stroke-width:2}
.diagram .prot{fill:#e2ecfb;stroke:#2a4f8f;stroke-width:3}
.diagram .pocket{fill:#fff;stroke:#2a4f8f;stroke-width:2;stroke-dasharray:4 3}
.diagram .mol circle{fill:#f3e8c8;stroke:#7a6420;stroke-width:3}
.diagram .chip rect{fill:#fde7e2;stroke:#8a3b2d;stroke-width:2}
.diagram .chip text{font:700 14px var(--font);fill:var(--ink)}
.diagram .pc circle{fill:#dff0e4;stroke:#2c6b45;stroke-width:2}
.diagram .pc text{font:700 14px var(--font);fill:var(--ink)}
.diagram .arrow{stroke:var(--ink);stroke-width:3;fill:none;marker-end:url(#ah)}

/* misc components */
.going{border:2px dashed var(--energy);background:var(--energy-bg);border-radius:8px;padding:8px 12px;margin-top:14px}
.going summary{cursor:pointer;font-weight:700}
.frame{border:2px solid var(--line);background:var(--gray);border-radius:8px;padding:8px 12px;margin-top:14px;font-size:.95em}
.frame b{display:block;font-size:.8rem;color:var(--muted);margin-bottom:2px}
.vocab{font-weight:700;color:var(--blue-d)}
table.cmp{border-collapse:collapse;width:100%;margin:10px 0;font-size:.95em}
table.cmp th,table.cmp td{border:2px solid var(--line);padding:6px 8px;text-align:left}
table.cmp th{background:var(--gray)}
.bars{display:inline-flex;gap:3px;vertical-align:middle}
.bars i{display:block;width:16px;height:18px;border:2px solid var(--ink);background:#fff}
.bars i.on{background:var(--energy)}
.hero{text-align:center;padding:10px 0 4px}
.hero h2{font-size:2rem;margin:6px 0}
.sortrow{display:flex;flex-wrap:wrap;gap:8px}
.card{padding:8px 12px;border:2px solid var(--blue);border-radius:8px;background:#fff;cursor:pointer;color:var(--ink);text-align:left}
.card.sel{outline:3px solid var(--energy);background:var(--energy-bg)}
.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media(max-width:560px){.buckets{grid-template-columns:1fr}}
.bucket{border:3px dashed var(--line);border-radius:10px;background:#fff;padding:8px;cursor:pointer;min-height:110px;text-align:left;color:var(--ink)}
.bucket strong{display:block;margin-bottom:4px}
.bucket .mini{display:block;font-size:.8rem;background:var(--blue-bg);border-radius:6px;padding:3px 6px;margin:3px 0}
.bigcard{font-size:1.25em;font-weight:600;text-align:center;padding:22px 12px;border:3px solid var(--blue);border-radius:12px;background:var(--blue-bg);margin:10px 0}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{display:flex;gap:4px;margin:6px 0}
.meter i{flex:1;height:16px;border:2px solid var(--ink);border-radius:3px;background:var(--energy)}
.meter i.gone{background:#fff;opacity:.35}
.pool{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--gray);border-radius:8px;min-height:50px;margin:8px 0}
.mol2{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:.85rem;font-weight:700}
.mol2.atp{background:var(--energy-bg);border-color:#8a5a00}
.mol2.adp{background:#fff}
.fp{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:2px solid #2c6b45;background:#dff0e4;border-radius:50%;font-size:.8rem;font-weight:700}
.counts{display:flex;gap:10px;flex-wrap:wrap;font-weight:600;font-size:.9rem}
.counts span{background:var(--gray);padding:3px 10px;border-radius:12px}
.model{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;align-items:center;margin:8px 0}
.model .mbox{grid-row:1/4;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid var(--line);border-radius:10px;padding:8px}
.model .ar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.model .ar span.a{font-size:1.4rem}
.pdots{display:flex;gap:4px}
.pdots span{width:24px;height:24px;border-radius:50%;background:#dff0e4;border:2px solid #2c6b45;font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.slotrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slotrow .lab{font-size:.85rem;font-weight:700;text-align:center;border-top:4px solid var(--blue);padding-top:2px}
textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:8px;padding:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
@media(max-width:560px){.stats{grid-template-columns:1fr}}
.stat{background:var(--gray);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.6rem}

/* toast */
#toast{position:fixed;top:64px;right:14px;background:var(--energy);color:#3a2800;font-weight:700;padding:6px 14px;border-radius:20px;z-index:60;opacity:0;transform:translateY(-8px);transition:all .25s;pointer-events:none}
#toast.show{opacity:1;transform:none}

/* read aloud */
.spk{border:0;background:var(--blue-bg);border-radius:50%;width:28px;height:28px;cursor:pointer;margin-right:6px;vertical-align:middle;padding:0;line-height:1;font-size:.85rem}
.w.hl{background:#ffe08a;border-radius:3px;box-shadow:0 0 0 2px #ffe08a}

/* drawers */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:#fff;border-left:3px solid var(--blue);z-index:50;padding:14px;overflow:auto;transform:translateX(105%);transition:transform .25s;visibility:hidden;font-size:16px;letter-spacing:0;word-spacing:0;line-height:1.5}
.drawer.open{transform:none;visibility:visible}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.drawer h2{margin:0;font-size:1.2rem}
.drawer label{display:block;margin:10px 0 2px;font-weight:600}
.drawer select,.drawer input[type=range]{width:100%}
.drawer select{padding:6px;border:2px solid var(--line);border-radius:6px}
.tints{display:flex;gap:8px;flex-wrap:wrap}
.tints button{width:44px;height:44px;border-radius:8px;border:3px solid var(--line);cursor:pointer}
.tints button.on{border-color:var(--blue);outline:2px solid var(--blue)}
.gl dt{font-weight:700;color:var(--blue-d);margin-top:10px}
.gl dd{margin:2px 0 0}
#lfT,#lfB{position:fixed;left:0;right:0;background:rgba(20,30,45,.45);z-index:40;pointer-events:none;display:none}
body.lf #lfT,body.lf #lfB{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="top">
  <h1>ATP: The Energy Molecule</h1>
  <div class="hud" aria-label="Your progress">
    <span id="bat" role="img" aria-label="Battery charge"></span>
    <span>⚡ <b id="xp">0</b> XP</span>
  </div>
  <button class="hudbtn" id="btnWords" type="button">📖 Word Wall</button>
  <button class="hudbtn" id="btnOpts" type="button">⚙ Reading Options</button>
</header>

<main id="stage" aria-live="polite"></main>

<footer id="nav">
  <button class="btn" id="back" type="button">◀ Back</button>
  <span id="navmsg"></span>
  <button class="btn primary" id="next" type="button">Next ▶</button>
</footer>

<div id="toast" role="status"></div>
<div id="lfT"></div><div id="lfB"></div>

<aside class="drawer" id="opts" role="dialog" aria-label="Reading options" aria-hidden="true">
  <div class="dh"><h2>Reading Options</h2><button class="btn" id="optsClose" type="button">Close</button></div>
  <label for="oFont">Font</label>
  <select id="oFont">
    <option value="'Lexend',Verdana,Geneva,sans-serif">Lexend (easy to read)</option>
    <option value="'Atkinson Hyperlegible',Verdana,sans-serif">Atkinson Hyperlegible</option>
    <option value="Verdana,Geneva,sans-serif">Verdana</option>
    <option value="Arial,Helvetica,sans-serif">Arial</option>
    <option value="'Comic Sans MS','Chalkboard SE',sans-serif">Comic Sans</option>
  </select>
  <label for="oSize">Text size</label>
  <input type="range" id="oSize" min="16" max="28" step="1">
  <label for="oLh">Line spacing</label>
  <input type="range" id="oLh" min="1.4" max="2.4" step="0.1">
  <label for="oLs">Letter spacing</label>
  <input type="range" id="oLs" min="0" max="0.15" step="0.01">
  <label for="oWs">Word spacing</label>
  <input type="range" id="oWs" min="0" max="0.4" step="0.05">
  <label>Background tint</label>
  <div class="tints" id="oTint"></div>
  <label><input type="checkbox" id="oFocus"> Line focus bar (follows your finger or mouse)</label>
  <label><input type="checkbox" id="oBolts"> Energy bolt effects (turn off if motion bothers you)</label>
  <label for="oRate">Read-aloud speed</label>
  <input type="range" id="oRate" min="0.6" max="1.3" step="0.05">
  <label for="oVoice">Read-aloud voice</label>
  <select id="oVoice"></select>
  <div class="row"><button class="btn" id="oReset" type="button">Reset options</button></div>
</aside>

<aside class="drawer" id="words" role="dialog" aria-label="Word Wall" aria-hidden="true">
  <div class="dh"><h2>Word Wall</h2><button class="btn" id="wordsClose" type="button">Close</button></div>
  <dl class="gl" id="glossary"></dl>
</aside>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
var stage = $('#stage');
function h(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
function shuffle(a){ a = a.slice(); for(var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

var ACTS = ['sort','decode','build','hunt','break','ladder','match','rapid','game','steps','model','boss'];
var DEFAULT_OPTS = {font:"'Lexend',Verdana,Geneva,sans-serif", size:18, lh:1.6, ls:0, ws:0, tint:'#ffffff', focus:false, bolts:true, rate:0.9, voice:''};
var S = { page:0, done:{}, xp:0, items:{}, name:'', hour:'', opts:Object.assign({}, DEFAULT_OPTS) };

/* ---------- toast / xp / battery ---------- */
var toastT;
function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 1300); }
function addXP(n){ S.xp += n; $('#xp').textContent = S.xp; toast('⚡ +' + n + ' XP'); }
function buildBattery(){ var b = $('#bat'); b.innerHTML = ''; ACTS.forEach(function(){ b.appendChild(document.createElement('i')); }); }
function updateBattery(){ var segs = $('#bat').children; ACTS.forEach(function(id, i){ segs[i].className = S.done[id] ? 'on' : ''; }); }
/* energy bolt spray */
var lastTarget = null, lastXY = {x:window.innerWidth / 2, y:window.innerHeight / 2};
document.addEventListener('click', function(e){ lastTarget = e.target; if(e.clientX || e.clientY) lastXY = {x:e.clientX, y:e.clientY}; }, true);
var BOLT_SVG = '<svg viewBox="-16 -36 34 72" width="22" height="46" aria-hidden="true"><path d="M0,-34 L-13,0 L0,0 L-9,34 L17,-10 L4,-10 L13,-34 Z" fill="#f2b01e" stroke="#8a5a00" stroke-width="3" stroke-linejoin="round"/></svg>';
function spray(count){
  if(S.opts.bolts === false) return;
  var calm = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var x = lastXY.x, y = lastXY.y;
  if(lastTarget && lastTarget.getBoundingClientRect && document.body.contains(lastTarget)){
    var r = lastTarget.getBoundingClientRect();
    if(r.width || r.height){ x = r.left + r.width / 2; y = r.top + r.height / 2; }
  }
  count = count || 10;
  for(var i = 0; i < count; i++){
    var b = document.createElement('div');
    b.innerHTML = BOLT_SVG;
    b.style.cssText = 'position:fixed;left:' + (x - 11) + 'px;top:' + (y - 23) + 'px;pointer-events:none;z-index:70;will-change:transform,opacity';
    document.body.appendChild(b);
    var ang = (Math.PI * 2 * i / count) + (Math.random() - 0.5) * 0.6;
    var dist = calm ? 40 + Math.random() * 30 : 70 + Math.random() * 90;
    var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - (calm ? 0 : 20);
    var rot = calm ? 0 : (Math.random() - 0.5) * 360;
    if(b.animate){
      var an = b.animate([
        {transform:'translate(0,0) rotate(0deg) scale(.4)', opacity:1},
        {transform:'translate(' + dx * 0.7 + 'px,' + dy * 0.7 + 'px) rotate(' + rot * 0.6 + 'deg) scale(1.1)', opacity:1, offset:0.6},
        {transform:'translate(' + dx + 'px,' + (dy + 40) + 'px) rotate(' + rot + 'deg) scale(.6)', opacity:0}
      ], {duration:650 + Math.random() * 350, easing:'cubic-bezier(.2,.7,.3,1)'});
      an.onfinish = (function(el){ return function(){ el.remove(); }; })(b);
    } else { b.remove(); }
  }
}
function tally(key, ok){
  var a = S.items[key] || (S.items[key] = {tries:0, solved:false});
  if(a.solved){ if(ok) spray(8); return; }
  a.tries++;
  if(ok){ a.solved = true; addXP(a.tries === 1 ? 10 : 5); spray(a.tries === 1 ? 12 : 8); }
}
function complete(id){
  if(!S.done[id]){ S.done[id] = true; updateBattery(); addXP(20); spray(24); }
  updateNav();
}
function fb(box, type, msg){ box.className = 'fb ' + type; box.style.display = ''; box.textContent = (type === 'ok' ? '✓ ' : type === 'no' ? '✗ ' : '') + msg; }
function newFb(){ var f = h('div', 'fb'); f.setAttribute('role', 'status'); f.setAttribute('aria-live', 'polite'); f.style.display = 'none'; return f; }

/* ---------- read aloud with highlighting ---------- */
var TTS = ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
function spk(t){
  return t.replace(/\bATP\b/g, 'A T P').replace(/\bADP\b/g, 'A D P').replace(/\bAMP\b/g, 'A M P')
          .replace(/→/g, 'becomes').replace(/\+/g, 'plus').replace(/⇄/g, 'and back to');
}
function wrapWords(el){
  if(el._w) return; el._w = true;
  var tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, { acceptNode: function(n){
    if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    if(n.parentElement && n.parentElement.closest('.spk')) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT; } });
  var nodes = []; while(tw.nextNode()) nodes.push(tw.currentNode);
  nodes.forEach(function(n){
    var frag = document.createDocumentFragment();
    n.nodeValue.split(/(\s+)/).forEach(function(tok){
      if(!tok) return;
      if(/^\s+$/.test(tok)) frag.appendChild(document.createTextNode(tok));
      else { var s = document.createElement('span'); s.className = 'w'; s.textContent = tok; frag.appendChild(s); }
    });
    n.parentNode.replaceChild(frag, n);
  });
}
var Reader = {
  q:[], i:0, active:false, cur:null, last:null,
  hl: function(w){ if(this.last) this.last.classList.remove('hl'); this.last = w; if(w) w.classList.add('hl'); },
  say: function(list){ if(!TTS) return; this.stop(); this.q = list; this.i = 0; this.active = true; this.next(); },
  next: function(){
    var self = this;
    if(!self.active || self.i >= self.q.length){ self.stop(); return; }
    var el = self.q[self.i++]; wrapWords(el);
    var ws = Array.prototype.slice.call(el.querySelectorAll('.w'));
    if(!ws.length){ self.next(); return; }
    var text = '', offs = [];
    ws.forEach(function(w){ offs.push(text.length); text += spk(w.textContent) + ' '; });
    var u = new SpeechSynthesisUtterance(text);
    u.rate = S.opts.rate;
    var vs = speechSynthesis.getVoices();
    var v = vs.filter(function(x){ return x.name === S.opts.voice; })[0];
    if(v) u.voice = v;
    u.onboundary = function(e){
      if(e.name && e.name !== 'word') return;
      var k = 0; for(var j = 0; j < offs.length; j++){ if(offs[j] <= e.charIndex) k = j; else break; }
      self.hl(ws[k]);
    };
    u.onend = function(){ self.hl(null); self.next(); };
    u.onerror = function(){ self.hl(null); };
    self.cur = u; speechSynthesis.speak(u);
  },
  stop: function(){ this.active = false; this.hl(null); if(TTS) speechSynthesis.cancel(); }
};
function decorate(root){
  if(!TTS) return;
  var list = Array.prototype.slice.call(root.querySelectorAll('.readable'));
  if(root.classList && root.classList.contains('readable')) list.unshift(root);
  list.forEach(function(el){
    if(el._spk) return; el._spk = true;
    var b = h('button', 'spk', '🔊'); b.type = 'button'; b.setAttribute('aria-label', 'Read this aloud'); b.title = 'Read aloud';
    b.onclick = function(ev){ ev.stopPropagation(); Reader.say([el]); };
    el.insertBefore(b, el.firstChild);
  });
}

function mcq(o){
  var w = h('div', 'q');
  var p = h('p', 'prompt readable', o.q); w.appendChild(p);
  var list = h('div', 'choices'); w.appendChild(list);
  var f = newFb(); w.appendChild(f);
  var solved = false, L = 'ABCDEFG';
  var arr = o.keep ? o.choices.map(function(t){ return {t:t}; }) : shuffle(o.choices.map(function(t){ return {t:t}; }));
  arr.forEach(function(c, i){
    var b = h('button', 'choice', '<span class="let">' + L[i] + '.</span><span>' + c.t + '</span>'); b.type = 'button';
    b.onclick = function(){
      if(solved || b.disabled) return;
      if(c.t === o.answer){
        solved = true; b.classList.add('ok');
        Array.prototype.forEach.call(list.children, function(x){ x.disabled = true; });
        tally(o.id, true); fb(f, 'ok', o.explain || 'Correct!');
        if(o.onSolved) o.onSolved();
      } else {
        b.classList.add('no'); b.disabled = true; tally(o.id, false); fb(f, 'no', o.hint || 'Not quite. Read the hint and try again.');
      }
    };
    list.appendChild(b);
  });
  decorate(w);
  return w;
}
function group(id, items, parent, onAll){
  var n = 0;
  items.forEach(function(it, i){
    var o = Object.assign({}, it, { id: id + ':' + i, onSolved: function(){ if(++n === items.length){ complete(id); if(onAll) onAll(); } } });
    parent.appendChild(mcq(o));
  });
}
function multi(o){
  var w = h('div', 'q'); w.appendChild(h('p', 'prompt readable', o.q));
  var list = h('div', 'choices'); w.appendChild(list);
  var f = newFb(); var picks = []; var locked = false;
  shuffle(o.options).forEach(function(op){
    var b = h('button', 'choice', '<span>' + op.t + '</span>'); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
    b.onclick = function(){ if(locked) return; var on = b.classList.toggle('pick'); b.setAttribute('aria-pressed', on ? 'true' : 'false'); };
    list.appendChild(b); picks.push({b:b, op:op});
  });
  var chk = h('button', 'btn primary', 'Check my answers'); chk.type = 'button';
  chk.onclick = function(){
    if(locked) return;
    var extra = picks.filter(function(x){ return x.b.classList.contains('pick') && !x.op.ok; }).length;
    var missing = picks.filter(function(x){ return !x.b.classList.contains('pick') && x.op.ok; }).length;
    if(!extra && !missing){

      picks.forEach(function(x){ x.b.disabled = true; if(x.op.ok) x.b.classList.add('ok'); });
      fb(f, 'ok', o.explain); chk.disabled = true; o.onSolved();

}
function tapPlace(o){
  var sel = null, toks = [];

  o.tokens.forEach(function(t){
    var b = h('button', 'tok' + (o.wide ? ' wide' : ''), t.html); b.type = 'button'; b.dataset.key = t.key;

    };
    o.tray.appendChild(b); toks.push(b);
  });
  o.slots.forEach(function(s, i){
    s.onclick = function(){

      var key = sel.dataset.key;

/* ---------- navigation ---------- */
function reqDone(pg){ return pg.req.every(function(id){ return S.done[id]; }); }
function updateNav(){
  var pg = PAGES[S.page]; var back = $('#back'), next = $('#next'), msg = $('#navmsg');
  back.style.visibility = S.page === 0 ? 'hidden' : 'visible';
  next.style.display = pg.last ? 'none' : '';
  next.textContent = S.page === 0 ? 'Start lesson ▶' : (S.page === PAGES.length - 2 ? 'Finish ▶' : 'Next ▶');
  var ok = reqDone(pg); next.disabled = !ok;
  msg.textContent = ok ? '' : 'Finish the ⚡ challenge to unlock Next.';
}
function go(n){
  Reader.stop(); S.page = n; var pg = PAGES[n]; stage.innerHTML = '';
  if(!pg.hide && !pg.last){
    var head = h('div', 'pagehead');
    head.innerHTML = '<div><span class="part">Part ' + n + ' of ' + (PAGES.length - 2) + '</span><h2>' + pg.title + '</h2></div>';
    if(TTS){ var rb = h('button', 'btn', '🔊 Read this screen'); rb.type = 'button'; rb.onclick = function(){ Reader.say(Array.prototype.slice.call(stage.querySelectorAll('.readable')).filter(function(e){ return e.offsetParent !== null; })); }; head.appendChild(rb); }
    stage.appendChild(head);
  }
  pg.render(stage); updateNav(); window.scrollTo(0, 0);
}
$('#back').onclick = function(){ if(S.page > 0) go(S.page - 1); };
$('#next').onclick = function(){ if(S.page < PAGES.length - 1 && reqDone(PAGES[S.page])) go(S.page + 1); };

/* ---------- glossary ---------- */
var GL = [
  ['ATP (adenosine triphosphate)','The energy molecule cells use. It stores energy and releases it when the cell needs it. It has 3 phosphates.'],
  ['ADP (adenosine diphosphate)','What is left when ATP loses one phosphate. It has 2 phosphates.'],
  ['AMP (adenosine monophosphate)','What is left when ADP loses a phosphate. It has 1 phosphate.'],
  ['Adenine','A ring-shaped part of ATP.'],
  ['Ribose','A sugar. In ATP it connects adenine to the phosphates.'],
  ['Adenosine','Adenine and ribose joined together.'],
  ['Phosphate','A part of ATP drawn as a P. ATP has a chain of three.'],
  ['Bond','The connection that holds parts of a molecule together.'],
  ['Chemical potential energy','Stored energy in chemical bonds.'],
  ['Hydrolysis','A reaction that breaks a bond and releases energy.'],
  ['Condensation','A reaction that builds a bond and stores energy.'],
  ['Enzyme','A special protein that helps a reaction happen.'],
  ['Recycle','To use again. Cells rebuild ATP from ADP and P.'],
  ['Carrier protein','A protein in the cell membrane that moves molecules across.'],
  ['Active transport','Moving molecules across a membrane using energy from ATP.'],
  ['Cell membrane','The thin outer layer of a cell.']
];
(function(){ var g = $('#glossary'); GL.forEach(function(t){ g.appendChild(h('dt', null, t[0])); var d = h('dd', 'readable', t[1]); g.appendChild(d); }); decorate(g); })();

/* ---------- reading options ---------- */
var TINTS = ['#ffffff','#fbf3dc','#e3f1fb','#e6f4e6','#f1e9f8','#f3f3f3'];
function applyOpts(){
  var o = S.opts, r = document.documentElement.style;
  r.setProperty('--font', o.font); r.setProperty('--fs', o.size + 'px'); r.setProperty('--lh', o.lh);
  r.setProperty('--ls', o.ls + 'em'); r.setProperty('--ws', o.ws + 'em'); r.setProperty('--bg', o.tint);
  document.body.classList.toggle('lf', !!o.focus);
  $('#oFont').value = o.font; $('#oSize').value = o.size; $('#oLh').value = o.lh; $('#oLs').value = o.ls; $('#oWs').value = o.ws;
  $('#oFocus').checked = !!o.focus; $('#oBolts').checked = o.bolts !== false; $('#oRate').value = o.rate;
  Array.prototype.forEach.call($('#oTint').children, function(b){ b.classList.toggle('on', b.dataset.c === o.tint); });
  try{ localStorage.setItem('atpLessonOpts', JSON.stringify(o)); }catch(e){}
}
(function(){
  try{ var saved = JSON.parse(localStorage.getItem('atpLessonOpts') || 'null'); if(saved) S.opts = Object.assign({}, DEFAULT_OPTS, saved); }catch(e){}
  var t = $('#oTint');
  TINTS.forEach(function(c){ var b = h('button'); b.type = 'button'; b.style.background = c; b.dataset.c = c; b.setAttribute('aria-label', 'Tint ' + c); b.onclick = function(){ S.opts.tint = c; applyOpts(); }; t.appendChild(b); });
  $('#oFont').onchange = function(e){ S.opts.font = e.target.value; applyOpts(); };
  $('#oSize').oninput = function(e){ S.opts.size = +e.target.value; applyOpts(); };
  $('#oLh').oninput = function(e){ S.opts.lh = +e.target.value; applyOpts(); };
  $('#oLs').oninput = function(e){ S.opts.ls = +e.target.value; applyOpts(); };
  $('#oWs').oninput = function(e){ S.opts.ws = +e.target.value; applyOpts(); };
  $('#oFocus').onchange = function(e){ S.opts.focus = e.target.checked; applyOpts(); updateFocus(window.innerHeight / 2); };
  $('#oBolts').onchange = function(e){ S.opts.bolts = e.target.checked; applyOpts(); };
  $('#oRate').oninput = function(e){ S.opts.rate = +e.target.value; applyOpts(); };
  $('#oVoice').onchange = function(e){ S.opts.voice = e.target.value; applyOpts(); };
  $('#oReset').onclick = function(){ S.opts = Object.assign({}, DEFAULT_OPTS); fillVoices(); applyOpts(); };
  function fillVoices(){
    var sel = $('#oVoice'); sel.innerHTML = '';
    if(!TTS){ sel.appendChild(h('option', null, 'Read aloud is not available on this device')); sel.disabled = true; return; }
    var vs = speechSynthesis.getVoices().filter(function(v){ return /^en/i.test(v.lang); });
    sel.appendChild(h('option', null, 'Default voice')).value = '';
    vs.forEach(function(v){ var op = h('option', null, v.name); op.value = v.name; sel.appendChild(op); });
    sel.value = S.opts.voice;
  }
  fillVoices(); if(TTS) speechSynthesis.onvoiceschanged = fillVoices;
  function openD(id){ var d = $(id); d.classList.add('open'); d.setAttribute('aria-hidden', 'false'); }
  function closeD(id){ var d = $(id); d.classList.remove('open'); d.setAttribute('aria-hidden', 'true'); }
  $('#btnOpts').onclick = function(){ closeD('#words'); openD('#opts'); };
  $('#btnWords').onclick = function(){ closeD('#opts'); openD('#words'); };
  $('#optsClose').onclick = function(){ closeD('#opts'); };
  $('#wordsClose').onclick = function(){ closeD('#words'); };
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeD('#opts'); closeD('#words'); } });
  applyOpts();
})();

/* line focus bar */
function updateFocus(y){ var half = 46; $('#lfT').style.cssText = 'top:0;height:' + Math.max(0, y - half) + 'px'; $('#lfB').style.cssText = 'top:' + (y + half) + 'px;bottom:0'; }
window.addEventListener('mousemove', function(e){ if(S.opts.focus) updateFocus(e.clientY); });
window.addEventListener('touchmove', function(e){ if(S.opts.focus && e.touches[0]) updateFocus(e.touches[0].clientY); }, {passive:true});
window.addEventListener('touchstart', function(e){ if(S.opts.focus && e.touches[0]) updateFocus(e.touches[0].clientY); }, {passive:true});
updateFocus(window.innerHeight / 2);

/* init */
buildBattery(); updateBattery(); go(0);
window.__atp = {S:S, PAGES:PAGES, go:go, complete:complete};
})();
